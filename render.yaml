services:
  - type: web
    runtime: static
    name: pulse-computer-club
    repo: https://github.com/klqmy/computer_club
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: python3 tool/download_web.py
    staticPublishPath: site
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
